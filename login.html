
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuneWave - Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-box {
      max-width: 400px;
      margin: 45px auto;
      padding: 25px;
      background: #191522;
      border: 1px solid #49345e;
      border-radius: 18px;
      text-align: center;
    }

    .auth-box h2 {
      color: #c084fc;
      margin-bottom: 10px;
    }

    .auth-box input {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #49345e;
      background: #0b0b12;
      color: white;
    }

    .auth-box button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #8b3fd1;
      color: white;
    }

    .auth-box a {
      color: #c084fc;
    }

    .auth-box p {
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎵 TuneWave</h1>
    <p>Your Music, Your Mood</p>
  </header>

  <section class="auth-box">
    <h2>Welcome Back!</h2>
    <p>Login to your music world 🎧</p>

    <form id="loginForm">
      <input type="email" placeholder="Email Address" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p>New to TuneWave?</p>
    <a href="signup.html">Create an Account</a>

    <p><a href="index.html">← Back to Home</a></p>
  </section>

  
<script>
  document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.querySelector('input[type="email"]').value.trim();
    const password = document.querySelector('input[type="password"]').value;

    if (email && password.length >= 6) {
      alert("Demo login successful! Welcome to TuneWave 🎵");
      window.location.href = "index.html";
    } else {
      alert("Please enter a valid email and password (at least 6 characters).");
    }
  });
</script>

</body>
</html>
